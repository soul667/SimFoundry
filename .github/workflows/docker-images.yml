name: Build reconstruction Docker images

on:
  pull_request:
    paths:
      - "docker/**"
      - "patches/splatfacto_depth_loss.patch"
      - ".github/workflows/docker-images.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "patches/splatfacto_depth_loss.patch"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      gaussian: ${{ steps.filter.outputs.gaussian }}
      registration: ${{ steps.filter.outputs.registration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed image inputs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gaussian:
              - 'docker/gaussian-trainer/**'
              - 'patches/splatfacto_depth_loss.patch'
            registration:
              - 'docker/rgbd-registration/**'

  build-gaussian:
    name: Build gaussian-trainer
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.gaussian == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/simfoundry-gaussian-trainer
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gaussian-trainer/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gaussian-trainer
          cache-to: type=gha,mode=max,scope=gaussian-trainer

  build-registration:
    name: Build rgbd-registration
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.registration == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/simfoundry-rgbd-registration
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,format=long

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rgbd-registration/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rgbd-registration
          cache-to: type=gha,mode=max,scope=rgbd-registration
